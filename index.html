      document.getElementById('app').hidden = true;
      const box = document.getElementById('startup');
      box.hidden = false; box.setAttribute('role', 'alert');
      const isFile = location.protocol === 'file:';
      const graphics = /WebGL|graphics|GPU|context/i.test(error && error.message || '');
      document.getElementById('startup-title').textContent = '게임을 시작하지 못했어요.';
      document.getElementById('startup-message').textContent = isFile
        ? 'HTML 파일을 직접 열면 게임을 실행할 수 없습니다. 아래 명령으로 실행해 주세요.'
        : graphics
          ? '브라우저에서 3D 그래픽(WebGL 2)을 시작할 수 없습니다. Chrome 또는 Edge의 그래픽 가속을 켜고 브라우저를 다시 시작해 주세요.'
          : '게임 파일을 불러오지 못했습니다. 실행 중인 로컬 서버를 확인하고 새로고침해 주세요.';
      document.getElementById('startup-error').textContent = error && error.message || String(error);
      document.getElementById('startup-details').hidden = false;
      document.getElementById('startup-retry').hidden = false;
    };
    document.getElementById('startup-retry').onclick = function() { location.reload(); };

  </script>
  <script type="module" src="/src/current-game.js"></script>
</body>
</html>
