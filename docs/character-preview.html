<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>내맘대로 캠핑 · 캐릭터</title><style>body{margin:0;background:#def4f4;color:#4c6d74;font:16px system-ui}canvas{display:block;width:100vw;height:100vh}.label{position:absolute;bottom:28px;left:22%;font-size:22px;pointer-events:none}.female{left:70%}header{position:absolute;top:24px;left:28px;font-weight:600;pointer-events:none}small{display:block;font-size:12px;font-weight:400;margin-top:8px}</style><header>내맘대로 캠핑<small>마우스로 회전 · 휠로 확대 · 얼굴은 움직이는 2D 표정</small></header><div class="label">남자</div><div class="label female">여자</div><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {createCamper,poseCamper} from '/src/characters.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#def4f4');scene.fog=new THREE.Fog('#def4f4',12,35);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.05,60);camera.position.set(2.3,2.6,8.6);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.45,0);controls.update();
scene.add(new THREE.HemisphereLight('#f4ffff','#8ebdc2',2.2));const light=new THREE.DirectionalLight('#fff5e3',3.2);light.position.set(-3,7,5);light.castShadow=true;light.shadow.mapSize.set(1024,1024);Object.assign(light.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:.1,far:20});light.shadow.bias=-.0003;scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#c5e8e9',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.005;floor.receiveShadow=true;scene.add(floor);
const male=createCamper(scene,{species:'male'}),female=createCamper(scene,{species:'female'});male.root.position.x=-1.13;female.root.position.x=1.13;male.root.rotation.y=.10;female.root.rotation.y=-.10;
for(const model of [male,female]){poseCamper(model,'stand');model.arms.forEach((arm,i)=>arm.rotation.z=(i?1:-1)*.32);}
function render(t){requestAnimationFrame(render);male.updateFace(t/1000);female.updateFace(t/1000+.8);controls.update();renderer.render(scene,camera);}requestAnimationFrame(render);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});window.__preview={male,female,renderer,camera,scene,pose:(name)=>{for(const m of [male,female])poseCamper(m,name)}};
</script></html>
